# Terminal and Markdown image support.
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
# Reset legacy appended entries, then use fixed indices for stable reloads.
set -su terminal-features
set -su terminal-overrides
set -s terminal-features[100] 'xterm-ghostty:RGB'
set -s terminal-overrides[100] '*:Smulx=\E[4::%p1%dm'
set -s terminal-overrides[101] '*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g allow-passthrough on
set -g visual-activity off
set -g focus-events on

# Keep the existing shell, mouse, scrollback and timing behavior explicit.
set -g mouse on
set -s escape-time 0
set -g repeat-time 1000
set -g history-limit 50000
set -g display-time 4000
set -g display-panes-time 1000
set -g status-interval 5
set -g status-keys emacs
set -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix shortcuts leave application Ctrl keys available.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind '\' select-pane -l
bind C-p previous-window
bind C-n next-window
bind Space last-window
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-H previous-window
bind -n M-L next-window

# Vi selection; tmux-yank adds system clipboard copying.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep clipboard, session restore and the existing theme.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-left-status-a '#S'
set -g @tmux-gruvbox-right-status-x '%d-%m-%Y'
set -g @tmux-gruvbox-right-status-y '%H:%M'
set -g @tmux-gruvbox-right-status-z '#{pane_current_path}'
set -g status-position top
run '~/.tmux/plugins/tpm/tpm'

# Clear legacy bindings when reloading an existing server.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n 'C-\'
unbind -n S-Left
unbind -n S-Right
unbind -n S-Up
unbind -n S-Down
